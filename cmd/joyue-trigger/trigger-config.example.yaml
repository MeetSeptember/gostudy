# joyue-trigger 配置示例
# 用法: joyue-trigger --config trigger-config.example.yaml --private-key <hex>
# 同一分片多合约：使用 joyue-trigger-v2，并在分片下配置 targets（见 trigger-v2-multi-agent.example.yaml）

# 分片配置：shardID -> {rpc, agent}
shards:
  "1":
    rpc: http://127.0.0.1:9502
    agent: "0x..."  # FruitShopAgentV2 地址（shard1）
  "2":
    rpc: http://127.0.0.1:9504
    agent: "0x..."  # FruitShopAgentV2 地址（shard2）

# 调用的函数签名（与 joyue-call 一致）
sig: "buyFruit(string,uint256)"

# 参数列表
args:
  - apple
  - "1"

# 每分片发送次数，0=持续模式（Ctrl+C 停止）
repeat: 5

# 每笔发送后间隔（ms），0=不限速
# 低负载：1000（约 1 TPS/分片）；高负载：0（全速）
interval_ms: 0

# 可选
gas: 300000
gas_tip_gwei: 1
