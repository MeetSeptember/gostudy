# Sparrow 多分片意图流：与 JOYUE 类似，一个 trigger 并行向 shard0 / shard1 的 IntentShop 发交易。
# 需在各分片部署 IntentShop；并运行 sparrow-transfer-batcher（--rpcs + --intent-shops + --coordinators）。
# 注意：新版 SparrowTransferIntentShop 已弃用 transferIntentRandom（会 revert）；请改为 transferIntentExplicit(address,address,uint256) 或改用 csv-trigger -scenario wallet-sparrow。
#
# joyue-trigger --config cmd/joyue-trigger/trigger-sparrow-intent-multishard.yaml \
#   --private-key "..." --metrics-output ./sparrow-sent.jsonl
#
# 将下方地址替换为实际部署的 SparrowIntentShop（各分片 RPC 与示例端口按本地节点修改）。

shards:
  "0":
    rpc: http://127.0.0.1:9500
    coordinator: ""
    agent: "0x61a049be2326C44637b6d6AfdF92480f67DCf076"  # Shard0 SparrowIntentShop
    sig: "transferIntentRandom(uint256)()"
    args: ["1"]
