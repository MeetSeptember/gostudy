# JOYUE 多分片配置：Agent 部署在所有分片，多分片同时发
# 用于 JOYUE vs 2PC 吞吐量对比实验
# 用法: joyue-trigger --config trigger-joyue-multishards.yaml --private-key <hex>

shards:
  "0":
    rpc: http://127.0.0.1:9500
    agent: "0x..."  # shard 0 的 FruitShopAgentV2 地址
  "1":
    rpc: http://127.0.0.1:9502
    agent: "0x..."  # shard 1 的 FruitShopAgentV2 地址
  "2":
    rpc: http://127.0.0.1:9504
    agent: "0x..."  # shard 2 的 FruitShopAgentV2 地址

sig: "buyFruit(string,uint256)"
args:
  - apple
  - "1"

# 低负载：interval_ms=1000（约 1 TPS/分片，3 分片共 3 TPS）
# 高负载：interval_ms=0（全速）
interval_ms: 0

# 0=持续模式（Ctrl+C 停止），或指定次数
repeat: 0

gas: 300000
gas_tip_gwei: 1
