# 2PC 配置：使用 coordinator 字段，Trigger 将解析 TwoPCStarted 获取 txId
# Coordinator 仅存在于某一分片（如 shard 0）
# 需要 Relayer 监听并转发 prepare/commit 请求
#
# 使用方式：
#   joyue-trigger --config trigger-2pc-coordinator.yaml --private-key "..." --metrics-output ./2pc-sent.jsonl
#   twopc-metrics --rpc http://127.0.0.1:9500 --coordinator <COORDINATOR_ADDR> --output ./2pc-metrics.csv
# 离线关联：按 tx_id 合并 sent 与 metrics

shards:
  "0":
    rpc: http://127.0.0.1:9500
    coordinator: "0x0000000000000000000000000000000000000000"  # 替换为实际 TwoPhaseCoordinator 地址
    sig: "buyFruit(string,uint256)"
    args: [apple, "1"]

repeat: 20
interval_ms: 500
gas: 800000
gas_tip_gwei: 1
