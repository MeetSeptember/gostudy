#    agent: "0x12a4113F44E5689C93df233008FD805BDc882ABb"
#    sig: "startFlashArb(address,uint256,uint256)"
#    args: ["100000", "0"]


repeat: 50
interval_ms: 0
gas: 500000
gas_tip_gwei: 1

