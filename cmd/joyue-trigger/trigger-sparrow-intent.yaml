# Sparrow：向 IntentShop 发单笔意图（需另开 sparrow-batcher 监听并代发 buyFruitWave）
#
# joyue-trigger --config cmd/joyue-trigger/trigger-sparrow-intent.yaml --private-key "..." --metrics-output ./sparrow-sent.jsonl
#
# 注意：不要把 Intent 地址写在 coordinator 里。coordinator 非空会启用 is2PC，metrics 只解析 TwoPCStarted，无法从 receipt 取 SparrowBuyIntent 的 intentId。
# 正确做法：coordinator 留空，agent = SparrowIntentShop 地址。

shards:
  "0":
    rpc: http://127.0.0.1:9500
    coordinator: ""
    agent: "0x61a049be2326C44637b6d6AfdF92480f67DCf076"
    sig: "buyFruitIntentByName(string,uint256)()"
    args: ["apple", "1"]

repeat: 400
interval_ms: 0
gas: 400000
gas_tip_gwei: 1
