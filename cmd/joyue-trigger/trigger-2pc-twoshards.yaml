# 2PC 双分片示例（可配 TwoPhaseCoordinator buyFruit / PeerTransferCoordinator2PC / PeerAmmSwapCoordinator2PC 等）
# 需要 Relayer：跨分片 prepare/commit/abort（预编译 0x6D / Executor 0x74）
#
# 重要（见 joyue-trigger main.go）：目标地址必须写在 **coordinator**，不能写 **agent**。
#   - coordinator 非空 → is2PC=true → receipt 里按 TwoPCStarted / PeerTransfer2PCStarted / PeerAmmSwap2PCStarted 解析 tx_id
#   - 若误用 agent → is2PC=false → 只认 JOYUE/Sparrow 的 Intent 类事件，2PC 的 Started 解析不到，JSONL 往往没有 tx_id
#
# joyue-trigger 写发送侧 JSONL（需 receipt 里能解析 tx_id）：
#   - TwoPhaseCoordinator → TwoPCStarted(...)
#   - PeerTransferCoordinator2PC → PeerTransfer2PCStarted(...)
#   - PeerAmmSwapCoordinator2PC → PeerAmmSwap2PCStarted(...)
# 完成侧用 twopc-metrics。
#
# 调用示例（建议在 go run 后加 `--`，避免参数被 go 工具吃掉）：
#   go run ./cmd/joyue-trigger -- -config cmd/joyue-trigger/trigger-2pc-twoshards.yaml -private-key <hex> -metrics-output ./2pc-trigger.jsonl

