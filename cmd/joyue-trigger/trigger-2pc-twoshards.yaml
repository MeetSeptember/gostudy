# 2PC 双分片：两个分片同时触发 buyFruit，Coordinator 在 shard 0
# 需要两个 Relayer：shard0 监听并转发 batchVerifyAndFreeze，shard1 监听并转发 callbacks
# 若出现 "fromBlock > latest" 或只有第一组完成：检查链是否出块、Relayer 是否都启动

#shards:
#  "0":
#    rpc: http://127.0.0.1:9500
#    coordinator: "0x61a049be2326C44637b6d6AfdF92480f67DCf076"  # shard 0 的 Coordinator 地址
#    sig: "buyFruit(string,uint256)"
#    args: [apple, "1"]
#  "1":
#    rpc: http://127.0.0.1:9502
#    coordinator: "0x63169D7049Fa7cfA842179AeC59CED7B00B32733"  # shard 1 的 Coordinator 地址
#    sig: "buyBook(string,uint256)"
#    args: [math, "1"]

shards:
  "0":
    rpc: http://127.0.0.1:9500
    agent: "0x61a049be2326C44637b6d6AfdF92480f67DCf076"  # shard 0 的 Coordinator 地址
    sig: "buyFruit(string,uint256)"
    args: [apple, "1"]
  "1":
    rpc: http://127.0.0.1:9502
    agent: "0x61a049be2326C44637b6d6AfdF92480f67DCf076"  # shard 0 的 Coordinator 地址
    sig: "buyFruit(string,uint256)"
    args: [ apple, "1" ]



repeat: 200
interval_ms: 0  # 0=不限速
gas: 800000
gas_tip_gwei: 1
